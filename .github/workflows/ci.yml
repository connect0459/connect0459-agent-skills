name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

run-name: CI on ${{ github.head_ref || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      whisper-transcribe: ${{ steps.filter.outputs.whisper-transcribe }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            whisper-transcribe:
              - 'src/whisper-transcribe/**'
              - '.github/workflows/ci.yml'

  whisper-transcribe:
    needs: changes
    if: needs.changes.outputs.whisper-transcribe == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/whisper-transcribe
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev

      # Reads channel + components from rust-toolchain.toml (repo root) automatically;
      # also wraps Swatinem/rust-cache for registry + target caching.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rust-src-dir: src/whisper-transcribe

      - name: Lint and format
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Build
        shell: bash
        run: cargo build --all-targets

      - name: Test
        shell: bash
        run: cargo test
