name: CI - whisper-transcribe

on:
  push:
    branches: [main]
    paths:
      - "src/whisper-transcribe/**"
      - ".github/workflows/ci-whisper-transcribe.yml"
  pull_request:
    paths:
      - "src/whisper-transcribe/**"
      - ".github/workflows/ci-whisper-transcribe.yml"
  workflow_dispatch:

run-name: CI - whisper-transcribe on ${{ github.head_ref || github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: src/whisper-transcribe

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev

      # Reads channel + components from rust-toolchain.toml (repo root) automatically;
      # also wraps Swatinem/rust-cache for registry + target caching.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rust-src-dir: src/whisper-transcribe

      - name: Lint and format
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Build
        shell: bash
        run: cargo build --all-targets

      - name: Test
        shell: bash
        run: cargo test
